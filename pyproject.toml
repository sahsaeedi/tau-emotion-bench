[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_emotion"]

[project]
name = "tau-emotion"
version = "1.0.0"
description = "τ-emotion-bench: a benchmark for customer-service agents talking to emotional users"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [
    { name = "Rishitosh Singh", email = "rishitoshs@gmail.com" },
    { name = "Amir Saeidi" },
    { name = "Shamanthak Hegde", email = "shamanthak.hegde@gmail.com" },
]
dependencies = [
    "rich",
    "tabulate>=0.9.0",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "loguru>=0.7.3",
    "docstring-parser>=0.16",
    "litellm>=1.80.15,<1.82.7",
    "tenacity>=9.0.0",
    "deepdiff>=8.4.2",
    "addict>=2.4.0",
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "typer>=0.12.5",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-xdist>=3.5.0",
    "ruff>=0.9.1",
    "pre-commit>=4.0.0",
]
all = [
    "tau-emotion[dev]",
]
[project.urls]
Homepage = "https://github.com/sahsaeedi/tau-emotion-bench"
Repository = "https://github.com/sahsaeedi/tau-emotion-bench"

[project.scripts]
tau-emotion = "tau_emotion.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*:",
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.*:",
]
markers = [
    "llm: calls an LLM; skipped when OPENAI_API_KEY is not set",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their modules' names.
"__init__.py" = ["F401"]
# TRACER's scripts put the pipeline on sys.path before importing from it.
"tracer/**/*.py" = ["E402"]

[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]
